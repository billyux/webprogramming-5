<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>카카오T 택시 호출</title>
    <!-- 1. 스타일 및 라이브러리 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f7f7f7; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; background: white; min-height: 100vh; position: relative; overflow: hidden; }
        .screen { display: none; width: 100%; height: 100vh; }
        .screen.active { display: block; }
        .banner { background: #f2f2f2; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 0.9rem; text-align: center; }

        /* 홈 화면 */
        .search-main { border: 2px solid #007bff; border-radius: 12px; padding: 15px; font-weight: bold; margin: 20px; }
        .service-grid { display: grid; grid-template-columns: repeat(5, 1fr); padding: 20px; }
        .service-item { text-align: center; cursor: pointer; }
        
        /* 택시 화면 (지도) */
        #map { width: 100%; height: 60vh; z-index: 1; }
        .bottom-card { background: white; padding: 20px; border-radius: 20px 20px 0 0; margin-top: -20px; box-shadow: 0 -5px 10px rgba(0,0,0,0.1); position: relative; z-index: 10; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- [홈 화면] -->
    <div id="home-screen" class="screen active">
        <div class="search-main">어디로 갈까요?</div>
         <div class="banner">아침 공복에 5일만 드세요 (광고)</div>
        <div class="service-grid">
            <div class="service-item" onclick="showScreen('taxi-screen')">
                <div style="width:45px; height:45px; background:#ddd; border-radius:10px; margin:0 auto 5px;"></div>
                <p>택시</p>
            </div>
            <div class="service-item" onclick="showScreen('taxi-screen')">
                <div style="width:45px; height:45px; background:#ddd; border-radius:10px; margin:0 auto 5px;"></div>
                <p>자전거</p>
            </div>
            <div class="service-item" onclick="showScreen('taxi-screen')">
                <div style="width:45px; height:45px; background:#ddd; border-radius:10px; margin:0 auto 5px;"></div>
                <p>버스</p>
            </div>
            <div class="service-item" onclick="showScreen('taxi-screen')">
                <div style="width:45px; height:45px; background:#ddd; border-radius:10px; margin:0 auto 5px;"></div>
                <p>자동차</p>
            </div>
        </div>
    </div>

    <!-- [택시 화면] -->
    <div id="taxi-screen" class="screen">
        <div id="map"></div>
        <div class="bottom-card">
            <div onclick="showScreen('search-screen')" style="cursor:pointer;">
                <p style="color:red; font-weight:bold;">● 어디로 갈까요?</p>
            </div>
        </div>
    </div>

    <!-- [검색 화면] -->
    <div id="search-screen" class="screen" style="padding:20px;">
        <input type="text" placeholder="도착지 검색" style="width:100%; padding:15px; border:1px solid #ccc;">
        <button onclick="showScreen('taxi-screen')" style="margin-top:20px;">취소</button>
    </div>

</div>

<script>
    let map = null;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        if(id === 'taxi-screen') {
            // 화면 전환 후 지도가 그려질 시간을 확보
            setTimeout(initMap, 200);
        }
    }

    function initMap() {
        if (map !== null) {
            map.invalidateSize();
            return;
        }

        // 브라우저 위치 확인
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                
                // 지도 생성
                map = L.map('map').setView([lat, lng], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                L.marker([lat, lng]).addTo(map).bindPopup("현재 위치").openPopup();
            }, (err) => {
                alert("위치 정보를 허용해야 지도가 표시됩니다.");
                // 권한 거부 시 부산 시청 기준으로 기본값 설정
                map = L.map('map').setView([35.1796, 129.0756], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            });
        }
    }
</script>
</body>
</html>
